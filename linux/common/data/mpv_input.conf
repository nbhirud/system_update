# VLC Comfort-Style Keybindings Compatibility
WHEEL_UP      add volume 2
WHEEL_DOWN    add volume -2
UP            add volume 5
DOWN          add volume -5
LEFT          seek -5 exact
RIGHT         seek 5 exact
SHIFT+LEFT    seek -60 exact
SHIFT+RIGHT   seek 60 exact
SPACE         cycle pause
f             cycle fullscreen
m             cycle mute
s             screenshot





# Seek
RIGHT seek 10
LEFT seek -10

UP seek 60
DOWN seek -60

# Volume
Shift+UP add volume 5
Shift+DOWN add volume -5

# Speed
] add speed 0.10
[ add speed -0.10

# Reset speed
BS set speed 1.0

# Frame stepping
. frame-step
, frame-back-step

# Playlist
PGUP playlist-prev
PGDWN playlist-next

# Screenshot
s screenshot

# Toggle subtitles
v cycle sub

# Fullscreen
f cycle fullscreen